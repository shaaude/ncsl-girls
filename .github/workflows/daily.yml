name: Daily update
on:
  schedule:
    # Off-the-hour minutes: GitHub delays or drops scheduled runs at :00 when busy.
    - cron: "17 11 * * *"    # 7:17 am EDT / 6:17 am EST every day
    - cron: "47 16 * * *"    # 12:47 pm Eastern every day (backup pull)
    - cron: "37 23 * * 6,0"  # 7:37 pm Eastern Saturday and Sunday
    - cron: "37 2 * * 0,1"   # 10:37 pm Eastern Saturday and Sunday, late scores
  push:
    branches: [main]
    paths: ["scripts/**", "site/index.html", "imports/**", "data/identity_decisions.json",
            "data/permissions.json", ".github/workflows/daily.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      discover:
        description: "Rescan for new or renamed divisions"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: "daily-update-${{ github.ref }}", cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: 1. Refresh NCSL source data
        run: |
          # Monday 7:17 am Eastern run also rescans for new divisions (TZ-aware, DST-safe)
          if [ "${{ inputs.discover }}" = "true" ] || { [ "$(TZ=America/New_York date +%u)" = "1" ] && case "$(TZ=America/New_York date +%H)" in 06|07) true;; *) false;; esac; }; then
            python scripts/fetch.py --discover
          else
            python scripts/fetch.py
          fi
      - name: NCSL standings, ratings and site data
        run: python scripts/build.py
      - name: 2. National source status (collection itself runs in ysg-weekly.yml)
        continue-on-error: true
        run: python scripts/collect_ysg.py status
      - name: 3-9. Validate, resolve identities, dedupe, rate, build national data
        continue-on-error: true      # a national failure must never block the NCSL site
        run: python scripts/build_national.py
      - name: 10. Validate site
        run: python scripts/validate_site.py
      - name: Save data
        run: |
          git config user.name "ncsl-bot"
          git config user.email "ncsl-bot@users.noreply.github.com"
          git add data site/data.json site/national imports
          git commit -m "Daily update $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin main && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:   # 11. one consistent artifact with both NCSL and national outputs
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
