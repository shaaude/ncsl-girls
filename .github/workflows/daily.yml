name: Daily update
on:
  schedule:
    # Off-the-hour minutes: GitHub delays or drops scheduled runs at :00 when busy.
    - cron: "17 11 * * *"    # 7:17 am Eastern every day
    - cron: "47 16 * * *"    # 12:47 pm Eastern every day (backup pull)
    - cron: "37 23 * * 6,0"  # 7:37 pm Eastern Saturday and Sunday
    - cron: "37 2 * * 0,1"   # 10:37 pm Eastern Saturday and Sunday, late scores
  push:
    branches: [main]
    paths: ["scripts/**", "site/index.html", ".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      discover:
        description: "Rescan for new or renamed divisions"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily-update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy
      - name: Download division pages
        run: |
          if [ "${{ inputs.discover }}" = "true" ] || { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "11" ]; }; then
            python scripts/fetch.py --discover
          else
            python scripts/fetch.py
          fi
      - name: Build standings, ratings and site data
        run: python scripts/build.py
      - name: Save data
        run: |
          git config user.name "ncsl-bot"
          git config user.email "ncsl-bot@users.noreply.github.com"
          git add data site/data.json
          git commit -m "Daily update $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin main && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    continue-on-error: true   # succeeds once GitHub Pages is switched on in repo settings
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
