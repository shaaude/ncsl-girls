name: Discover divisions
on:
  push:
    branches: [main]
    paths: [".github/workflows/discover.yml", "scripts/discover.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/discover.py 116702700 116703300
      - name: Commit results
        run: |
          git config user.name "ncsl-bot"
          git config user.email "ncsl-bot@users.noreply.github.com"
          git add data
          git commit -m "Discovery scan $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main && git push
